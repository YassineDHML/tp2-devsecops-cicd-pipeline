# Pipeline CI/CD du TP2 : build, tests unitaires, SAST, SCA, DAST, puis publication.
#
#   build-test ----------------------------\
#   build-image --+--> dast ----------------\
#   sast ---------------------------------- +--> security-gate --> release (main uniquement)
#   sca-pip-audit -------------------------/
#   sca-dependency-check -----------------/
#
# Chaque controle bloque le pipeline des qu'une vulnerabilite de severite haute ou
# critique est detectee. Le job "security-gate" (seul controle exige par la
# protection de la branche main) agrege les resultats, et "release" ne s'execute
# que s'il est vert : une version non securisee n'est jamais publiee.
name: CI/CD securise

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Chaque lundi : de nouvelles CVE sont publiees meme sans nouveau commit
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Moindre privilege : le jeton du workflow ne peut que lire le depot.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  # Seuils de blocage (voir RAPPORT.md, section 4.1 "Politique de blocage")
  BANDIT_FAIL_LEVEL: high      # severite Bandit minimale qui bloque (low | medium | high)
  DC_FAIL_ON_CVSS: "7"         # score CVSS minimal qui bloque (7.0 = High, 9.0 = Critical)

jobs:
  # ------------------------------------------------------------------ phase 1
  build-test:
    name: Build et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt
      - name: Compiler le code (verification syntaxique)
        run: python -m compileall -q app tests scripts
      - name: Tests unitaires et couverture (seuil 90 %)
        run: |
          mkdir -p ci-reports
          pytest --junitxml=ci-reports/junit.xml \
                 --cov=app --cov-report=term-missing \
                 --cov-report=xml:ci-reports/coverage.xml \
                 --cov-fail-under=90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-tests
          path: ci-reports/
          if-no-files-found: ignore

  build-image:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construire l'image
        run: docker build -t notes-app:${{ github.sha }} .
      - name: Exporter l'image (meme artefact pour le DAST et la release)
        run: docker save notes-app:${{ github.sha }} | gzip > notes-app-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-app-image
          path: notes-app-image.tar.gz
          retention-days: 1
          compression-level: 0

  # ------------------------------------------------------------------ phase 2
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer Bandit
        run: python -m pip install -r requirements-dev.txt
      - name: Rapports complets (tous niveaux, non bloquants)
        run: |
          mkdir -p ci-reports
          bandit -r app -f json -o ci-reports/bandit.json --exit-zero
          bandit -r app -f html -o ci-reports/bandit.html --exit-zero
          python scripts/security_report.py bandit ci-reports/bandit.json
      - name: "GATE SAST : echec si une vulnerabilite de severite HIGH est detectee"
        run: bandit -r app --severity-level "$BANDIT_FAIL_LEVEL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-sast-bandit
          path: ci-reports/
          if-no-files-found: ignore

  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer pip-audit
        run: python -m pip install -r requirements-dev.txt
      - name: Rapport JSON et resume (non bloquants)
        run: |
          mkdir -p ci-reports
          pip-audit -r requirements.txt --no-deps --disable-pip -f json -o ci-reports/pip-audit.json || true
          python scripts/security_report.py pip-audit ci-reports/pip-audit.json
      # pip-audit n'expose pas de score CVSS (base PyPA/OSV) : toute vulnerabilite
      # connue de requirements.txt bloque, un correctif existant etant toujours indique.
      - name: "GATE SCA (1/2) : echec si une dependance a une vulnerabilite connue"
        run: pip-audit -r requirements.txt --no-deps --disable-pip --desc off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-sca-pip-audit
          path: ci-reports/
          if-no-files-found: ignore

  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cle de cache hebdomadaire de la base NVD
        id: nvd
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache de la base NVD
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/dc-data
          key: dc-data-${{ steps.nvd.outputs.week }}
          restore-keys: dc-data-
      # --enableExperimental : l'analyseur pip de requirements.txt est experimental
      # --nvdDatafeed        : miroir officiel de la base NVD (evite l'API NVD, tres lente sans cle)
      # --failOnCVSS 7       : code de sortie 15 si une CVE de score >= 7 (High/Critical) est trouvee
      - name: "GATE SCA (2/2) : OWASP Dependency-Check, echec si CVSS >= 7"
        run: |
          mkdir -p ~/dc-data ci-reports/dependency-check
          chmod -R 777 ~/dc-data ci-reports/dependency-check
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$HOME/dc-data:/usr/share/dependency-check/data" \
            -v "$PWD/ci-reports/dependency-check:/report" \
            owasp/dependency-check:13.0.0 \
            --project "TP2 Notes App" --scan /src \
            --exclude "**/.git/**" --exclude "**/ci-reports/**" \
            --enableExperimental --disableOssIndex \
            --nvdDatafeed "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/" \
            --format HTML --format JSON --out /report \
            --failOnCVSS "$DC_FAIL_ON_CVSS"
      - name: Resume du rapport Dependency-Check
        if: always()
        run: python scripts/security_report.py dependency-check ci-reports/dependency-check/dependency-check-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-sca-dependency-check
          path: ci-reports/
          if-no-files-found: ignore

  # ------------------------------------------------------------------ phase 3
  dast:
    name: DAST - OWASP ZAP (environnement ephemere)
    runs-on: ubuntu-latest
    needs: build-image
    timeout-minutes: 30
    env:
      IMAGE: notes-app:${{ github.sha }}
      OUT_DIR: ci-reports/zap
      FAIL_ON: high              # niveau d'alerte ZAP qui bloque (ZAP n'a pas de niveau "critical" : High est le plus eleve)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-app-image
      - name: Charger l'image construite par le job build-image
        run: docker load --input notes-app-image.tar.gz
      - name: Deployer l'environnement ephemere (reseau Docker + application)
        run: bash scripts/dast.sh deploy
      - name: Scan DAST OWASP ZAP (spider + scan actif authentifies)
        run: bash scripts/dast.sh scan
      - name: "GATE DAST : echec si une alerte de risque High est detectee"
        run: bash scripts/dast.sh gate
      - name: Detruire l'environnement ephemere
        if: always()
        run: bash scripts/dast.sh destroy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rapport-dast-zap
          path: ci-reports/zap/
          if-no-files-found: ignore

  # Feu vert unique : c'est le seul controle exige par la protection de la branche main.
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [build-test, build-image, sast, sca-pip-audit, sca-dependency-check, dast]
    if: always()
    steps:
      - name: Bilan des controles
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Security gate"
            echo
            echo "| Controle | Resultat |"
            echo "|---|---|"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result != "success")' > /dev/null; then
            echo "::error::Au moins un controle n'est pas vert : version non securisee, publication bloquee."
            exit 1
          fi
          echo "Tous les controles sont verts : la publication est autorisee."

  # Publication : uniquement sur main, uniquement si le security gate est vert, et
  # c'est l'image testee par le DAST (meme artefact) qui est publiee.
  release:
    name: Release (publication de l'image)
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes-app-image
      - name: Charger l'image validee
        run: docker load --input notes-app-image.tar.gz
      - name: Publier l'image sur GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/notes-app"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "notes-app:${GITHUB_SHA}" "${REGISTRY_IMAGE}:${GITHUB_SHA}"
          docker tag "notes-app:${GITHUB_SHA}" "${REGISTRY_IMAGE}:latest"
          docker push "${REGISTRY_IMAGE}:${GITHUB_SHA}"
          docker push "${REGISTRY_IMAGE}:latest"
          echo "Image publiee : ${REGISTRY_IMAGE}:${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
